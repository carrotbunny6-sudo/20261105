<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>POP WORD! Toy Box — 50-Word Mastery Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-cream: #FFF8FC;
    --ink: #231934;
    --ink-soft: #7B6C94;
    --pink: #FF4791;
    --yellow: #FFD43B;
    --cyan: #15D1FF;
    --mint: #1CE59E;
    --purple: #9B5DE5;
    --orange: #FF8533;
    --unit-color: #FF4791;
    --unit-soft: #FFE5F1;
    --border-thick: 4px solid #231934;
    --shadow-chunky: 0 8px 0 #231934;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }

  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: 'Fredoka', sans-serif;
    color: var(--ink);
    background-color: var(--bg-cream);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(255, 71, 145, 0.12) 0%, transparent 35%),
      radial-gradient(circle at 85% 80%, rgba(21, 209, 255, 0.14) 0%, transparent 35%),
      radial-gradient(#EBDDF8 2.5px, transparent 2.5px);
    background-size: 100% 100%, 100% 100%, 32px 32px;
  }

  /* Full-bleed Desktop Layout */
  .app-shell {
    width: 100vw;
    height: 100vh;
    display: grid;
    grid-template-rows: 86px 1fr;
    padding: 16px 22px 22px;
    gap: 18px;
  }

  /* ================= TOP BAR (SEQUENTIAL UNIT PROGRESSION) ================= */
  .top-nav {
    background: #FFFFFF;
    border: var(--border-thick);
    border-radius: 28px;
    box-shadow: var(--shadow-chunky);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    gap: 12px;
  }

  .brand-pill {
    background: var(--pink);
    color: #FFF;
    font-size: 1.45rem;
    font-weight: 700;
    padding: 8px 18px;
    border-radius: 18px;
    border: 3.5px solid var(--ink);
    box-shadow: 0 4px 0 var(--ink);
    display: flex;
    align-items: center;
    gap: 8px;
    transform: rotate(-1.5deg);
    flex-shrink: 0;
  }

  /* Unit Progression Steps */
  .unit-tabs {
    display: flex;
    align-items: center;
    gap: 10px;
    overflow-x: auto;
    padding: 4px 2px;
  }

  .unit-tab {
    border: 3.5px solid var(--ink);
    background: #F4EFFA;
    color: var(--ink);
    font-family: 'Fredoka', sans-serif;
    font-size: 1.02rem;
    font-weight: 700;
    padding: 8px 15px;
    border-radius: 18px;
    box-shadow: 0 4px 0 var(--ink);
    display: flex;
    align-items: center;
    gap: 7px;
    white-space: nowrap;
    transition: all 0.15s ease;
    cursor: default;
  }

  .unit-tab.active {
    background: var(--unit-color);
    color: #FFF;
    transform: translateY(-2px);
    box-shadow: 0 6px 0 var(--ink);
  }

  .unit-tab.completed {
    background: #E3FFF3;
    color: #076642;
  }

  .unit-tab.locked {
    background: #ECE6F4;
    color: var(--ink-soft);
    opacity: 0.72;
    box-shadow: 0 2px 0 var(--ink);
  }

  .unit-tab.wiggle {
    animation: shakeError 0.35s ease;
  }

  /* Right Mastery Progress & Sound */
  .hud-right {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }

  .mastery-pill {
    background: #FFF4C2;
    border: 3.5px solid var(--ink);
    box-shadow: 0 4px 0 var(--ink);
    border-radius: 18px;
    padding: 7px 16px;
    font-size: 1.15rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .sound-btn {
    width: 50px;
    height: 50px;
    border-radius: 16px;
    border: 3.5px solid var(--ink);
    background: #FFF;
    box-shadow: 0 4px 0 var(--ink);
    font-size: 1.4rem;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: transform 0.12s;
  }

  .sound-btn:hover {
    transform: translateY(-2px);
  }

  .sound-btn:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 var(--ink);
  }

  /* ================= MAIN 2-COLUMN WORKSPACE ================= */
  .main-grid {
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 20px;
    height: 100%;
    min-height: 0;
  }

  /* LEFT: BIG TOY UNBOXING STAGE */
  .play-stage {
    background: #FFFFFF;
    border: var(--border-thick);
    border-radius: 34px;
    box-shadow: var(--shadow-chunky);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 24px 32px;
    position: relative;
    overflow: hidden;
    background-image:
      radial-gradient(circle at 50% 22%, var(--unit-soft) 0%, transparent 58%);
  }

  .stage-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 2;
  }

  .unit-title-pill {
    background: var(--unit-color);
    color: #FFF;
    border: 3.5px solid var(--ink);
    box-shadow: 0 4px 0 var(--ink);
    padding: 7px 18px;
    border-radius: 99px;
    font-size: 1.2rem;
    font-weight: 700;
  }

  .capsule-counter {
    background: var(--unit-soft);
    border: 3.5px solid var(--ink);
    box-shadow: 0 4px 0 var(--ink);
    padding: 7px 18px;
    border-radius: 99px;
    font-size: 1.2rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* Center Toy Capsule Showcase */
  .toy-centerpiece {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin: auto 0;
    z-index: 2;
  }

  .capsule-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    min-height: 184px;
  }

  /* Pop Mart Acrylic Display Box */
  .toy-capsule {
    width: 180px;
    height: 180px;
    border-radius: 44px;
    background: radial-gradient(circle at 32% 28%, #FFFFFF 0%, var(--unit-soft) 100%);
    border: 4.5px solid var(--ink);
    box-shadow:
      inset 0 -10px 0 rgba(0, 0, 0, 0.08),
      0 10px 0 var(--ink),
      0 18px 30px rgba(35, 25, 52, 0.14);
    display: grid;
    place-items: center;
    position: relative;
    transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .toy-capsule.mystery-state {
    background: radial-gradient(circle at 32% 28%, #FFF9E6 0%, var(--unit-soft) 100%);
  }

  .toy-capsule.cue-pop {
    animation: popIn 0.42s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .toy-capsule.speaking-pulse {
    animation: speakingPulse 0.6s ease infinite alternate;
    outline: 5px solid var(--mint);
  }

  .toy-capsule::before {
    content: "";
    position: absolute;
    top: 12px;
    left: 16px;
    width: 36px;
    height: 14px;
    background: rgba(255, 255, 255, 0.85);
    border-radius: 99px;
    transform: rotate(-25deg);
    pointer-events: none;
  }

  .toy-art-container {
    width: 132px;
    height: 132px;
    display: grid;
    place-items: center;
    font-size: 4.8rem;
    line-height: 1;
    text-align: center;
    filter: drop-shadow(0 8px 6px rgba(35, 25, 52, 0.16));
  }

  /* Audio Listen Button: Hidden until 3 wrong attempts! */
  .listen-pill-btn {
    display: none;
    border: 4px solid var(--ink);
    background: var(--yellow);
    box-shadow: 0 7px 0 var(--ink);
    border-radius: 26px;
    padding: 16px 24px;
    font-family: 'Fredoka', sans-serif;
    font-size: 1.35rem;
    font-weight: 700;
    color: var(--ink);
    cursor: pointer;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .listen-pill-btn.unlocked {
    display: flex;
    animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .listen-pill-btn:hover {
    transform: translateY(-4px) scale(1.04);
    background: #FFE066;
  }

  .listen-pill-btn:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 var(--ink);
  }

  .listen-pill-btn .speaker-icon {
    font-size: 2.1rem;
  }

  /* Answer Slots Tray */
  .answer-slots-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 14px 24px;
    background: #F8F4FC;
    border: 4px solid var(--ink);
    border-radius: 28px;
    box-shadow: inset 0 4px 8px rgba(35, 25, 52, 0.08);
    min-height: 100px;
  }

  .letter-slot {
    width: 66px;
    height: 74px;
    border-radius: 20px;
    border: 3.5px dashed #BDAFD0;
    background: #FFFFFF;
    display: grid;
    place-items: center;
    font-size: 2.3rem;
    font-weight: 700;
    color: var(--ink);
    transition: all 0.16s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .letter-slot.filled {
    border: 4px solid var(--ink);
    background: linear-gradient(180deg, #FFFFFF 0%, #FFF2B2 100%);
    box-shadow: 0 6px 0 var(--ink);
    transform: translateY(-4px);
    cursor: pointer;
  }

  .letter-slot.filled:hover {
    background: #FFE0EA;
    transform: translateY(-6px) scale(1.04);
  }

  .letter-slot.win-pop {
    background: linear-gradient(180deg, #72FFCA 0%, #1CE59E 100%) !important;
    transform: scale(1.1) translateY(-6px);
  }

  .letter-slot.oops-shake {
    background: #FFD6E4 !important;
    animation: shakeError 0.4s ease;
  }

  /* Scrambled 3D Vinyl Letter Keycaps */
  .letter-bank-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    min-height: 92px;
    padding: 6px 12px;
  }

  .keycap-tile {
    width: 72px;
    height: 80px;
    border-radius: 22px;
    border: 4px solid var(--ink);
    background: linear-gradient(180deg, #FFFFFF 0%, #F3EAFF 100%);
    box-shadow: 0 8px 0 var(--ink), inset 0 3px 0 #FFFFFF;
    font-family: 'Fredoka', sans-serif;
    font-size: 2.45rem;
    font-weight: 700;
    color: var(--ink);
    cursor: pointer;
    display: grid;
    place-items: center;
    position: relative;
    transition: transform 0.14s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.14s, opacity 0.15s;
  }

  .keycap-tile::before {
    content: "";
    position: absolute;
    top: 7px;
    left: 10px;
    width: 16px;
    height: 7px;
    border-radius: 99px;
    background: rgba(255, 255, 255, 0.9);
    pointer-events: none;
  }

  .keycap-tile:hover:not(.used) {
    transform: translateY(-5px) scale(1.05);
    background: linear-gradient(180deg, #FFFFFF 0%, #FFE4F1 100%);
    box-shadow: 0 11px 0 var(--ink);
  }

  .keycap-tile:active:not(.used) {
    transform: translateY(5px);
    box-shadow: 0 2px 0 var(--ink);
  }

  .keycap-tile.used {
    opacity: 0.16;
    transform: translateY(5px) scale(0.9);
    box-shadow: 0 1px 0 var(--ink);
    pointer-events: none;
  }

  /* Stage Footer: Only Clear & Mix Letters (No Skip!) */
  .stage-footer {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    z-index: 2;
  }

  .helper-btn {
    border: 3.5px solid var(--ink);
    border-radius: 18px;
    padding: 10px 24px;
    font-family: 'Fredoka', sans-serif;
    font-size: 1.15rem;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 5px 0 var(--ink);
    background: #FFF;
    color: var(--ink);
    transition: transform 0.12s;
  }

  .helper-btn:hover {
    transform: translateY(-2px);
  }

  .helper-btn:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 var(--ink);
  }

  .helper-btn.reset-btn {
    background: #FFE8F0;
  }

  .helper-btn.mix-btn {
    background: #E6F8FF;
  }

  /* ================= RIGHT: 10-TOY COLLECTOR CASE (LOCKED PROGRESSION) ================= */
  .collector-panel {
    background: #FFFFFF;
    border: var(--border-thick);
    border-radius: 34px;
    box-shadow: var(--shadow-chunky);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .collector-header {
    padding: 16px 20px;
    border-bottom: var(--border-thick);
    background: var(--unit-soft);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 1.25rem;
    font-weight: 700;
  }

  .collector-count-badge {
    background: #FFF;
    border: 3px solid var(--ink);
    border-radius: 99px;
    padding: 3px 12px;
    font-size: 1rem;
  }

  .collector-grid {
    flex: 1;
    padding: 14px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: repeat(5, 1fr);
    gap: 10px;
    min-height: 0;
  }

  .blindbox-slot {
    border: 3.5px solid var(--ink);
    border-radius: 20px;
    background: #F4EFFA;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    position: relative;
    transition: transform 0.15s ease;
    box-shadow: 0 4px 0 var(--ink);
  }

  .blindbox-slot.active-slot {
    background: #FFF4C2;
    outline: 3.5px solid var(--pink);
    transform: scale(1.02);
  }

  .blindbox-slot.unboxed {
    background: #E8FFF5;
    cursor: pointer;
  }

  .blindbox-slot.locked-slot {
    opacity: 0.68;
    background: #EFEAF6;
    box-shadow: 0 2px 0 var(--ink);
  }

  .blindbox-slot.wiggle {
    animation: shakeError 0.35s ease;
  }

  .slot-icon-box {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    border: 2.5px solid var(--ink);
    background: #FFF;
    display: grid;
    place-items: center;
    font-size: 1.5rem;
    flex-shrink: 0;
  }

  .blindbox-slot.locked-slot .slot-icon-box {
    background: #E2D9EE;
    font-size: 1.35rem;
  }

  .slot-text {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .slot-num {
    font-size: 0.76rem;
    color: var(--ink-soft);
    font-weight: 700;
  }

  .slot-word {
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Celebration Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(35, 25, 52, 0.7);
    backdrop-filter: blur(6px);
    display: none;
    place-items: center;
    z-index: 100;
  }

  .modal-overlay.show {
    display: grid;
  }

  .celebration-card {
    background: #FFF;
    border: 5px solid var(--ink);
    border-radius: 36px;
    box-shadow: 0 14px 0 var(--ink);
    padding: 34px;
    width: 440px;
    max-width: 90vw;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .trophy-bubble {
    width: 130px;
    height: 130px;
    border-radius: 34px;
    background: #FFF4C2;
    border: 4px solid var(--ink);
    box-shadow: 0 7px 0 var(--ink);
    display: grid;
    place-items: center;
    font-size: 4.5rem;
  }

  .big-ok-btn {
    border: 4px solid var(--ink);
    background: var(--mint);
    box-shadow: 0 6px 0 var(--ink);
    border-radius: 22px;
    padding: 13px 32px;
    font-family: 'Fredoka', sans-serif;
    font-size: 1.35rem;
    font-weight: 700;
    cursor: pointer;
    margin-top: 6px;
    transition: transform 0.12s;
  }

  .big-ok-btn:hover {
    transform: translateY(-2px);
  }

  #confetti-canvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 95;
  }

  @keyframes shakeError {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-7px); }
    50% { transform: translateX(7px); }
    75% { transform: translateX(-5px); }
  }

  @keyframes popIn {
    0% { transform: scale(0.65); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  @keyframes speakingPulse {
    0% { transform: scale(1); }
    100% { transform: scale(1.06); }
  }

  @media (max-width: 1100px) {
    .main-grid {
      grid-template-columns: 1fr 310px;
    }
    .keycap-tile {
      width: 62px;
      height: 70px;
      font-size: 2rem;
    }
    .letter-slot {
      width: 58px;
      height: 66px;
      font-size: 1.95rem;
    }
  }
</style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<div class="app-shell">
  <!-- TOP BAR -->
  <header class="top-nav">
    <div class="brand-pill">
      <span>🎁</span> POP WORD!
    </div>

    <nav class="unit-tabs" id="unit-tabs" aria-label="Unit Progression">
      <!-- Populated by JS -->
    </nav>

    <div class="hud-right">
      <div class="mastery-pill" title="Must Pass All 50 Words to Complete!">
        <span>🏆</span> <span id="mastery-count">0 / 50 Passed</span>
      </div>
      <button class="sound-btn" id="sound-toggle" title="Sound On/Off">🔊</button>
    </div>
  </header>

  <!-- MAIN 2-COLUMN KIDS WORKSPACE -->
  <main class="main-grid">
    <!-- LEFT: PLAY STAGE (NO SKIPPING) -->
    <section class="play-stage">
      <div class="stage-header">
        <div class="unit-title-pill" id="unit-title-pill">Unit 0: Friends</div>
        <div class="capsule-counter" id="capsule-counter">
          <span>🧸</span> Question 1 of 10
        </div>
      </div>

      <!-- BIG TOY CAPSULE (VISUAL CUE AFTER 2 WRONG ATTEMPTS) & LISTEN BUTTON (AFTER 3 WRONG ATTEMPTS) -->
      <div class="toy-centerpiece">
        <div class="capsule-row">
          <div class="toy-capsule mystery-state" id="toy-capsule-box">
            <div class="toy-art-container" id="toy-art"></div>
          </div>

          <button class="listen-pill-btn" id="listen-btn" title="Listen (UK English)">
            <span class="speaker-icon">🔊</span>
            <span>Listen</span>
          </button>
        </div>

        <!-- ANSWER SLOTS -->
        <div class="answer-slots-wrap" id="answer-slots"></div>

        <!-- SCRAMBLED LETTER TILES -->
        <div class="letter-bank-wrap" id="letter-bank"></div>
      </div>

      <!-- SIMPLE KIDS FOOTER (NO SKIP BUTTONS) -->
      <div class="stage-footer">
        <button class="helper-btn reset-btn" id="clear-btn">
          <span>🔄</span> Clear
        </button>
        <button class="helper-btn mix-btn" id="shuffle-btn">
          <span>🔀</span> Mix Letters
        </button>
      </div>
    </section>

    <!-- RIGHT: 10-TOY COLLECTOR BOX -->
    <aside class="collector-panel">
      <div class="collector-header">
        <span id="shelf-title">🌈 Unit Toy Box</span>
        <span class="collector-count-badge" id="shelf-progress">0 / 10</span>
      </div>
      <div class="collector-grid" id="collector-grid">
        <!-- 10 Toy Slots Populated by JS -->
      </div>
    </aside>
  </main>
</div>

<!-- UNIT / GAME COMPLETE CELEBRATION MODAL -->
<div class="modal-overlay" id="celebration-modal">
  <div class="celebration-card">
    <div class="trophy-bubble" id="modal-icon">🏆</div>
    <h2 style="font-size: 2rem;" id="modal-title">Unit Passed!</h2>
    <p style="font-size: 1.2rem; color: var(--ink-soft);" id="modal-subtitle">
      You unboxed all 10 toys in this unit!
    </p>
    <button class="big-ok-btn" id="modal-next-btn">▶ Next Unit!</button>
  </div>
</div>

<script>
/* ==========================================================================
   1. POP MART MYSTERY BLIND-BOX SVG & CUSTOM KAWAII VISUAL CUE SVGS
   ========================================================================== */
function mysteryBlindBoxSVG(boxColor = '#FF4791') {
  return `<svg viewBox="0 0 120 120" width="120" height="120">
    <rect x="18" y="34" width="84" height="72" rx="18" fill="${boxColor}" stroke="#231934" stroke-width="6"/>
    <rect x="51" y="34" width="18" height="72" fill="#FFD43B" stroke="#231934" stroke-width="5"/>
    <rect x="12" y="24" width="96" height="20" rx="10" fill="#FFFFFF" stroke="#231934" stroke-width="6"/>
    <path d="M60 24 C44 6, 26 14, 42 26 Z" fill="#FFD43B" stroke="#231934" stroke-width="5" stroke-linejoin="round"/>
    <path d="M60 24 C76 6, 94 14, 78 26 Z" fill="#FFD43B" stroke="#231934" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="60" cy="23" r="6" fill="#FF4791" stroke="#231934" stroke-width="4"/>

/* ==========================================================================
   3. RELIABLE UK ENGLISH TTS & SOUND ENGINE
      - Preloads Google Oxford UK English MP3 (ssl.gstatic.com) per word
      - Falls back instantaneously inside the user gesture to Google UK English
        Web Speech API (en-GB) with anti-GC protection so TTS never fails!
   ========================================================================== */
window._activeUtterances = [];

class KidAudio {
  constructor() {
    this.ctx = null;
    this.enabled = true;
    this.ukVoice = null;
    this.preloadedAudio = null;
    this.preloadedWord = '';
    this.preloadedReady = false;
    this.initVoices();
  }

  initVoices() {
    if (!('speechSynthesis' in window)) return;
    const pickVoice = () => {
      const voices = window.speechSynthesis.getVoices();
      if (!voices || !voices.length) return;
      // Prioritize Google UK English Female/Male, then any en-GB voice, then any English voice
      this.ukVoice =
        voices.find(v => v.name === 'Google UK English Female') ||
        voices.find(v => v.name === 'Google UK English Male') ||
        voices.find(v => v.lang && v.lang.toLowerCase().includes('en-gb') && v.name.includes('Google')) ||
        voices.find(v => v.lang && v.lang.toLowerCase().replace('_', '-') === 'en-gb') ||
        voices.find(v => v.lang && v.lang.toLowerCase().startsWith('en-gb')) ||
        voices.find(v => v.lang && v.lang.toLowerCase().startsWith('en')) ||
        null;
    };
    pickVoice();
    window.speechSynthesis.onvoiceschanged = pickVoice;
  }

  init() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    if ('speechSynthesis' in window) {
      window.speechSynthesis.resume();
    }
  }

  /* Preload Google's static UK English dictionary MP3 when each question starts */
  preloadWordAudio(word) {
    const clean = word.toLowerCase().trim();
    this.preloadedWord = clean;
    this.preloadedReady = false;

    const audioEl = new Audio();
    audioEl.referrerPolicy = 'no-referrer';
    audioEl.preload = 'auto';
    audioEl.src = `https://ssl.gstatic.com/dictionary/static/sounds/oxford/${encodeURIComponent(clean)}--_gb_1.mp3`;

    audioEl.addEventListener('canplaythrough', () => {
      if (this.preloadedWord === clean) {
        this.preloadedReady = true;
      }
    }, { once: true });

    this.preloadedAudio = audioEl;
  }

  beep(freq, type = 'sine', dur = 0.08, delay = 0, vol = 0.12) {
    if (!this.enabled) return;
    this.init();
    if (!this.ctx) return;

    const now = this.ctx.currentTime + delay;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);

    gain.gain.setValueAtTime(0.001, now);
    gain.gain.exponentialRampToValueAtTime(vol, now + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);

    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + dur + 0.02);
  }

  popTile(step = 0) {
    this.beep(440 + step * 35, 'triangle', 0.07, 0, 0.14);
  }

  undoTile() {
    this.beep(300, 'sine', 0.07, 0, 0.12);
  }

  unlockCueChime() {
    this.beep(523.25, 'sine', 0.1, 0, 0.14);
    this.beep(783.99, 'triangle', 0.14, 0.07, 0.15);
  }

  unlockAudioChime() {
    this.beep(587.33, 'sine', 0.1, 0, 0.14);
    this.beep(880, 'triangle', 0.14, 0.07, 0.15);
  }

  /* Gentle, brief sparkle so it never drowns out the spoken word */
  winSparkle() {
    this.beep(659.25, 'sine', 0.08, 0, 0.09);
    this.beep(987.77, 'sine', 0.1, 0.06, 0.09);
  }

  tryAgain() {
    this.beep(220, 'sine', 0.12, 0, 0.14);
    this.beep(185, 'sine', 0.15, 0.09, 0.14);
  }

  /* Speak using browser's built-in Google UK English (en-GB) voice */
  speakWebSpeechUK(word) {
    if (!('speechSynthesis' in window)) return;
    try {
      window.speechSynthesis.resume();
      if (window.speechSynthesis.speaking || window.speechSynthesis.pending) {
        window.speechSynthesis.cancel();
      }

      const utter = new SpeechSynthesisUtterance(word);
      utter.lang = 'en-GB';
      utter.rate = 0.88;
      utter.pitch = 1.05;
      utter.volume = 1.0;

      if (!this.ukVoice) this.initVoices();
      if (this.ukVoice) utter.voice = this.ukVoice;

      const capsule = document.getElementById('toy-capsule-box');
      utter.onstart = () => {
        if (capsule) capsule.classList.add('speaking-pulse');
      };
      utter.onend = () => {
        if (capsule) capsule.classList.remove('speaking-pulse');
        const idx = window._activeUtterances.indexOf(utter);
        if (idx !== -1) window._activeUtterances.splice(idx, 1);
      };
      utter.onerror = () => {
        if (capsule) capsule.classList.remove('speaking-pulse');
      };

      // Prevent Chrome garbage-collecting the utterance mid-speech
      window._activeUtterances.push(utter);
      window.speechSynthesis.speak(utter);
    } catch (e) {}
  }

  /* Primary UK English pronunciation method called synchronously on user action */
  speakUK(word) {
    if (!this.enabled) return;
    this.init();

    const clean = word.toLowerCase().trim();
    const capsule = document.getElementById('toy-capsule-box');

    // If the preloaded Google Oxford UK MP3 is ready in memory, play it immediately
    if (this.preloadedReady && this.preloadedAudio && this.preloadedWord === clean) {
      try {
        this.preloadedAudio.currentTime = 0;
        if (capsule) capsule.classList.add('speaking-pulse');
        this.preloadedAudio.onended = () => {
          if (capsule) capsule.classList.remove('speaking-pulse');
        };
        const playPromise = this.preloadedAudio.play();
        if (playPromise !== undefined) {
          playPromise.catch(() => {
            if (capsule) capsule.classList.remove('speaking-pulse');
            this.speakWebSpeechUK(word);
          });
        }
        return;
      } catch (e) {
        // Fall through to Web Speech UK
      }
    }

    // Immediate synchronous fallback to Google UK English Web Speech API
    this.speakWebSpeechUK(word);
  }
}

/* ==========================================================================
   4. CONFETTI ENGINE
   ========================================================================== */
const canvas = document.getElementById('confetti-canvas');
const ctx = canvas.getContext('2d');
let confetti = [];

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function burstConfetti(x = window.innerWidth / 2, y = window.innerHeight / 2, count = 45) {
  const colors = ['#FF4791', '#FFD43B', '#15D1FF', '#1CE59E', '#9B5DE5', '#FF8533'];
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 4 + Math.random() * 10;
    confetti.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 4,
      size: 8 + Math.random() * 7,
      color: colors[Math.floor(Math.random() * colors.length)],
      rot: Math.random() * 6,
      vRot: (Math.random() - 0.5) * 0.2,
      life: 1
    });
  }
}

function loopConfetti() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (let i = confetti.length - 1; i >= 0; i--) {
    const p = confetti[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.32;
    p.rot += p.vRot;
    p.life -= 0.016;
    if (p.life <= 0) {
      confetti.splice(i, 1);
      continue;
    }
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.globalAlpha = Math.max(p.life, 0);
    ctx.fillStyle = p.color;
    ctx.strokeStyle = '#231934';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.7, 3);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }
  requestAnimationFrame(loopConfetti);
}
loopConfetti();

};

function getCurrentWord() {
  return WORDS[state.currentGlobalIndex];
}

function getCurrentUnit() {
  const wordObj = getCurrentWord();
  return UNITS[wordObj.unitIndex];
}

function getUnitWords(unitIndex) {
  return WORDS.filter(w => w.unitIndex === unitIndex);
}

function applyTheme() {
  const u = getCurrentUnit();
  document.documentElement.style.setProperty('--unit-color', u.color);
  document.documentElement.style.setProperty('--unit-soft', u.soft);
}

function renderUnitTabs() {
  const nav = document.getElementById('unit-tabs');
  nav.innerHTML = '';
  const activeUnitIndex = getCurrentWord().unitIndex;

  UNITS.forEach((u, idx) => {
    const btn = document.createElement('div');
    let statusClass = 'locked';
    let statusIcon = '🔒';

    if (idx < activeUnitIndex) {
      statusClass = 'completed';
      statusIcon = '✅';
    } else if (idx === activeUnitIndex) {
      statusClass = 'active';
      statusIcon = u.icon;
    }

    btn.className = `unit-tab ${statusClass}`;
    btn.innerHTML = `<span>${statusIcon}</span> <span>${u.name}</span>`;

    btn.addEventListener('click', () => {
      if (idx !== activeUnitIndex) {
        audio.tryAgain();
        btn.classList.remove('wiggle');
        void btn.offsetWidth;
        btn.classList.add('wiggle');
      }
    });

    nav.appendChild(btn);
  });
}

function loadCurrentQuestion() {
  applyTheme();
  const wordObj = getCurrentWord();
  state.wrongAttempts = 0;
  state.isSolvedReveal = false;
  state.slots = wordObj.answer.split('').map(() => ({
    char: '',
    tileIndex: null
  }));
  state.tiles = wordObj.scramble.split('').map((ch, i) => ({
    char: ch,
    used: false,
    id: i
  }));

  // Preload UK English audio for this word in the background
  audio.preloadWordAudio(wordObj.answer);

  renderAll();
}

function updateCuesVisibility(animateVisual = false) {
  const wordObj = getCurrentWord();
  const unitObj = getCurrentUnit();
  const capsuleBox = document.getElementById('toy-capsule-box');
  const artEl = document.getElementById('toy-art');
  const listenBtn = document.getElementById('listen-btn');

  // 1. Visual Cue: Shown only after 2 wrong attempts OR when solved!
  if (state.wrongAttempts >= 2 || state.isSolvedReveal) {
    capsuleBox.classList.remove('mystery-state');
    if (animateVisual) {
      capsuleBox.classList.remove('cue-pop');
      void capsuleBox.offsetWidth;
      capsuleBox.classList.add('cue-pop');
    }
    if (wordObj.svg) {
      artEl.innerHTML = wordObj.svg;
    } else {
      artEl.textContent = wordObj.emoji;
    }
  } else {
    capsuleBox.classList.add('mystery-state');
    capsuleBox.classList.remove('cue-pop');
    artEl.innerHTML = mysteryBlindBoxSVG(unitObj.color);
  }

  // 2. Audio Button: Shown only after 3 wrong attempts!
  if (state.wrongAttempts >= 3) {
    listenBtn.classList.add('unlocked');
  } else {
    listenBtn.classList.remove('unlocked');
  }
}

function renderStage() {
  const unitObj = getCurrentUnit();
  const questionNumInUnit = (state.currentGlobalIndex % 10) + 1;

  document.getElementById('unit-title-pill').textContent = unitObj.name;
  document.getElementById('capsule-counter').innerHTML =
    `<span>🧸</span> Question ${questionNumInUnit} of 10`;

  updateCuesVisibility(false);
  renderSlotsAndTiles();
}

function renderSlotsAndTiles() {
  const wordObj = getCurrentWord();
  const slotsWrap = document.getElementById('answer-slots');
  slotsWrap.innerHTML = '';

  state.slots.forEach((slot, sIdx) => {
    const el = document.createElement('div');
    el.className = `letter-slot ${slot.char ? 'filled' : ''}`;

    const displayChar = (sIdx === 0 && wordObj.answer[0] === wordObj.answer[0].toUpperCase() && slot.char)
      ? slot.char.toUpperCase()
      : slot.char;
    el.textContent = displayChar;

    // Clicking a placed letter pops it back out to the bank
    el.addEventListener('click', () => {
      if (state.busy || !slot.char) return;
      audio.undoTile();
      if (slot.tileIndex !== null && state.tiles[slot.tileIndex]) {
        state.tiles[slot.tileIndex].used = false;
      }
      state.slots[sIdx] = { char: '', tileIndex: null };
      renderSlotsAndTiles();
    });

    slotsWrap.appendChild(el);
  });

  const bankWrap = document.getElementById('letter-bank');
  bankWrap.innerHTML = '';

  state.tiles.forEach((tile, tIdx) => {
    const btn = document.createElement('button');
    btn.className = `keycap-tile ${tile.used ? 'used' : ''}`;
    btn.textContent = tile.char;
    btn.addEventListener('click', () => pickTile(tIdx));
    bankWrap.appendChild(btn);
  });
}

function pickTile(tIdx) {
  if (state.busy) return;
  const tile = state.tiles[tIdx];
  if (!tile || tile.used) return;

  const emptyIdx = state.slots.findIndex(s => !s.char);
  if (emptyIdx === -1) return;

  tile.used = true;
  state.slots[emptyIdx] = {
    char: tile.char,
    tileIndex: tIdx
  };
  renderSlotsAndTiles();

  // Check synchronously inside the click/key gesture when the last slot is filled
  // so browser user-activation for TTS is 100% preserved!
  if (state.slots.every(s => s.char !== '')) {
    checkAnswer();
  } else {
    audio.popTile(emptyIdx);
  }
}

function checkAnswer() {
  if (state.busy) return;
  const wordObj = getCurrentWord();
  const attempt = state.slots.map(s => s.char).join('').toLowerCase();
  const target = wordObj.answer.toLowerCase();
  const slotEls = document.querySelectorAll('.letter-slot');

  if (attempt === target) {
    // 100% CORRECT — QUESTION PASSED!
    // Immediately read out the word in UK English inside the user gesture!
    state.busy = true;
    state.isSolvedReveal = true;
    updateCuesVisibility(true);

    slotEls.forEach(el => el.classList.add('win-pop'));

    audio.winSparkle();
    audio.speakUK(wordObj.answer);

    const rect = document.getElementById('toy-capsule-box').getBoundingClientRect();
    burstConfetti(rect.left + rect.width / 2, rect.top + rect.height / 2, 55);

    const finishedUnit = (state.currentGlobalIndex % 10) === 9;
    const finishedAll50 = state.currentGlobalIndex === WORDS.length - 1;

    // Wait 1.75s so the child hears the full spoken word clearly before advancing
    setTimeout(() => {
      state.busy = false;

      if (finishedAll50) {
        document.getElementById('mastery-count').textContent = `50 / 50 Passed`;
        document.getElementById('modal-icon').textContent = '👑';
        document.getElementById('modal-title').textContent = 'YOU PASSED ALL 50!';
        document.getElementById('modal-subtitle').textContent =
          'Super Champion! You unboxed every single toy from Unit 0 to Unit 4!';
        document.getElementById('modal-next-btn').textContent = '🔄 Play Again';
        document.getElementById('celebration-modal').classList.add('show');
        burstConfetti(window.innerWidth / 2, window.innerHeight / 2, 100);
      } else if (finishedUnit) {
        const u = getCurrentUnit();
        state.currentGlobalIndex++;
        renderAll();
        document.getElementById('modal-icon').textContent = u.icon;
        document.getElementById('modal-title').textContent = `${u.name} Passed!`;
        document.getElementById('modal-subtitle').textContent =
          'Awesome job! You passed all 10 words in this unit!';
        document.getElementById('modal-next-btn').textContent = '▶ Start Next Unit!';
        document.getElementById('celebration-modal').classList.add('show');
        burstConfetti(window.innerWidth / 2, window.innerHeight / 2, 85);
      } else {
        state.currentGlobalIndex++;
        loadCurrentQuestion();
      }
    }, 1750);

  } else {
    // WRONG ATTEMPT
    state.busy = true;
    state.wrongAttempts++;
    audio.tryAgain();

    slotEls.forEach(el => el.classList.add('oops-shake'));

    // If this is the 3rd wrong attempt, unlock the Listen button and speak the word now
    if (state.wrongAttempts === 3) {
      updateCuesVisibility(false);
      audio.speakUK(wordObj.answer);
    }

    setTimeout(() => {
      // Return tiles to bank for a clean retry
      state.slots.forEach((slot, idx) => {
        if (slot.tileIndex !== null && state.tiles[slot.tileIndex]) {
          state.tiles[slot.tileIndex].used = false;
        }
        state.slots[idx] = { char: '', tileIndex: null };
      });

      // After 2 wrong attempts -> Reveal the Visual Cue!
      if (state.wrongAttempts === 2) {
        audio.unlockCueChime();
        updateCuesVisibility(true);
      }

      state.busy = false;
      renderSlotsAndTiles();
    }, 520);
  }
}

function renderCollectorShelf() {
  const unitIndex = getCurrentWord().unitIndex;
  const u = UNITS[unitIndex];
  const unitWords = getUnitWords(unitIndex);
  const currentPosInUnit = state.currentGlobalIndex % 10;

  document.getElementById('shelf-title').textContent = `${u.icon} Unit Toy Box`;
  document.getElementById('shelf-progress').textContent = `${currentPosInUnit} / 10`;

  const grid = document.getElementById('collector-grid');
  grid.innerHTML = '';

  unitWords.forEach((item, idx) => {
    const isPassed = idx < currentPosInUnit;
    const isCurrent = idx === currentPosInUnit;
    const isLocked = idx > currentPosInUnit;

    const card = document.createElement('div');
    let cls = 'blindbox-slot';
    if (isPassed) cls += ' unboxed';
    if (isCurrent) cls += ' active-slot';
    if (isLocked) cls += ' locked-slot';
    card.className = cls;

    let iconDisplay = '🔒';
    let labelDisplay = 'Locked';
    let statusTag = `Question #${idx + 1}`;

    if (isPassed) {
      iconDisplay = item.emoji;
      labelDisplay = item.answer;
      statusTag = `Question #${idx + 1} 🔊`;
    } else if (isCurrent) {
      iconDisplay = '🎁';
      labelDisplay = item.scramble;
      statusTag = `Question #${idx + 1} 🌟`;
    }

    card.innerHTML = `
      <div class="slot-icon-box">${iconDisplay}</div>
      <div class="slot-text">
        <span class="slot-num">${statusTag}</span>
        <span class="slot-word">${labelDisplay}</span>
      </div>
    `;

    card.addEventListener('click', () => {
      if (isPassed) {
        // Clicking an already-passed toy on the shelf reads out its word in UK English!
        audio.speakUK(item.answer);
      } else if (!isCurrent) {
        audio.tryAgain();
        card.classList.remove('wiggle');
        void card.offsetWidth;
        card.classList.add('wiggle');
      }
    });

    grid.appendChild(card);
  });
}

function renderAll() {
  document.getElementById('mastery-count').textContent =
    `${state.currentGlobalIndex} / ${WORDS.length} Passed`;
  renderUnitTabs();
  renderStage();
  renderCollectorShelf();
}

/* ==========================================================================
   6. FOOTER & KEYBOARD CONTROLS
   ========================================================================== */
document.getElementById('clear-btn').addEventListener('click', () => {
  if (state.busy) return;
  audio.undoTile();
  state.slots.forEach((slot, idx) => {
    if (slot.char) {
      if (slot.tileIndex !== null && state.tiles[slot.tileIndex]) {
        state.tiles[slot.tileIndex].used = false;
      }
      state.slots[idx] = { char: '', tileIndex: null };
    }
  });
  renderSlotsAndTiles();
});

document.getElementById('shuffle-btn').addEventListener('click', () => {
  if (state.busy) return;
  audio.popTile(2);
  state.slots.forEach((slot, idx) => {
    if (slot.char) {
      if (slot.tileIndex !== null && state.tiles[slot.tileIndex]) {
        state.tiles[slot.tileIndex].used = false;
      }
      state.slots[idx] = { char: '', tileIndex: null };
    }
  });

  for (let i = state.tiles.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [state.tiles[i], state.tiles[j]] = [state.tiles[j], state.tiles[i]];
  }
  renderSlotsAndTiles();
});

document.getElementById('listen-btn').addEventListener('click', () => {
  if (state.wrongAttempts >= 3) {
    audio.speakUK(getCurrentWord().answer);
  }
});

document.getElementById('sound-toggle').addEventListener('click', (e) => {
  audio.enabled = !audio.enabled;
  e.currentTarget.textContent = audio.enabled ? '🔊' : '🔇';
});

document.getElementById('modal-next-btn').addEventListener('click', () => {
  document.getElementById('celebration-modal').classList.remove('show');
  if (state.currentGlobalIndex === WORDS.length - 1 &&
      state.slots.every(s => s.char !== '')) {
    state.currentGlobalIndex = 0;
  }
  loadCurrentQuestion();
});

// Physical Keyboard Support
window.addEventListener('keydown', (e) => {
  if (state.busy) return;
  if (document.getElementById('celebration-modal').classList.contains('show')) {
    if (e.key === 'Enter') document.getElementById('modal-next-btn').click();
    return;
  }

  if (e.key === 'Backspace') {
    e.preventDefault();
    for (let i = state.slots.length - 1; i >= 0; i--) {
      if (state.slots[i].char) {
        const tIdx = state.slots[i].tileIndex;
        if (tIdx !== null && state.tiles[tIdx]) state.tiles[tIdx].used = false;
        state.slots[i] = { char: '', tileIndex: null };
        audio.undoTile();
        renderSlotsAndTiles();
        break;
      }
    }
    return;
  }

  if (/^[a-zA-Z]$/.test(e.key)) {
    const ch = e.key.toLowerCase();
    const idx = state.tiles.findIndex(t => !t.used && t.char.toLowerCase() === ch);
    if (idx !== -1) pickTile(idx);
  }
});

// Boot Game at Question #1 (Unit 0, Toy #1)
loadCurrentQuestion();
</script>
